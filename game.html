      return;

  async function toggleFullscreen() {
    if (!isFullscreen()) {
      let nativeOpened = false;
      try {
        if (gameFrame.requestFullscreen) {
          try { await gameFrame.requestFullscreen({ navigationUI: 'hide' }); }
          catch (_) { await gameFrame.requestFullscreen(); }
        } else if (gameFrame.webkitRequestFullscreen) {
          gameFrame.webkitRequestFullscreen();
          await new Promise(resolve => setTimeout(resolve, 80));
        }
        nativeOpened = isNativeFullscreen();
      } catch (_) {
        nativeOpened = false;
      }
      if (!nativeOpened) setPseudoFullscreen(true);
    } else {
      setPseudoFullscreen(false);
      try {
        if (isNativeFullscreen() && document.exitFullscreen) await document.exitFullscreen();
        else if (isNativeFullscreen() && document.webkitExitFullscreen) document.webkitExitFullscreen();

  function saveBestRun() {
    const completed = stats.filter(Boolean).length;
    if (runStartLevel !== 0 || completed !== levels.length) return;
    const total = runElapsed;
    if (!Number.isFinite(total) || total <= 0) return;
    try {
      const old = Number(localStorage.getItem('monoshift-best-10')) || Infinity;
      if (total < old) localStorage.setItem('monoshift-best-10', String(total));
    } catch (_) {}
  }

  function getBestRun() {
    try {
      const value = Number(localStorage.getItem('monoshift-best-10'));
      return Number.isFinite(value) && value > 0 ? value : null;
    } catch (_) {
      return null;
    }
  }

  function calculateLevelScore(index, result) {
    const total = result.total || levels[index].shards.length;
    const shards = Math.max(0, Math.min(total, result.shards || 0));
    const par = PAR_TIMES[index] || 20;
    const baseScore = 1000;
    const signalScore = Math.round((shards / Math.max(1, total)) * 1800);
    const overtime = Math.max(0, (result.time || par) - par);
    const timeScore = Math.max(0, 2200 - Math.round(overtime * 110));
    const attemptPenalty = Math.max(0, ((result.attempts || 1) - 1) * 180);
    const score = Math.max(500, Math.min(5000, baseScore + signalScore + timeScore - attemptPenalty));
    const stars = score >= 4200 && shards === total ? 3 : score >= 2800 ? 2 : 1;
    return { score, stars, par, baseScore, signalScore, timeScore, attemptPenalty };
  }

  function formatScore(value) {
    return Math.round(value || 0).toLocaleString('en-US');
  }

  function starString(stars) {
    return `${'★'.repeat(stars || 0)}${'☆'.repeat(Math.max(0, 3 - (stars || 0)))}`;
  }

  function overallRank(score, completed) {
    if (completed < levels.length) return '—';
    if (score >= 45000) return 'S';
    if (score >= 40000) return 'A';
    if (score >= 34000) return 'B';
    if (score >= 27000) return 'C';
    return 'D';
  }

  function normalizeLevelRecord(index, saved) {
    if (!saved) return null;
    const total = saved.total || levels[index].shards.length;
    const seed = {
      time: Number(saved.time || saved.bestTime || PAR_TIMES[index]),
      shards: Number(saved.shards ?? saved.bestShards ?? 0),
      total,
      attempts: Number(saved.attempts || 1)
    };
    const calculated = calculateLevelScore(index, seed);
    return {
      ...saved,
      completed: true,
      total,
      time: seed.time,
      attempts: seed.attempts,
      shards: seed.shards,
      score: Number(saved.score) || calculated.score,
      stars: Number(saved.stars) || calculated.stars,
      bestTime: Number(saved.bestTime || seed.time),
      bestShards: Number(saved.bestShards ?? seed.shards)
    };
  }

  function saveLevelBest(index, result) {
    const previous = getLevelBest(index);
    const scored = { ...result, ...calculateLevelScore(index, result), completed: true };
    const candidateWins = !previous || scored.score > previous.score || (scored.score === previous.score && scored.time < previous.time);
    const record = candidateWins ? { ...scored } : { ...previous };
    record.bestTime = previous ? Math.min(previous.bestTime || previous.time, result.time) : result.time;
    record.bestShards = previous ? Math.max(previous.bestShards || previous.shards || 0, result.shards) : result.shards;
    record.completed = true;

    // Keep an in-memory record so completion works inside sandboxed previews
    // where localStorage may be unavailable.
    levelRecords[index] = record;

    try {
      localStorage.setItem(`monoshift-level-${index}`, JSON.stringify(record));
    } catch (_) {}
    return scored;
  }

  function getLevelBest(index) {
    if (levelRecords[index]) return levelRecords[index];
    try {
      const saved = JSON.parse(localStorage.getItem(`monoshift-level-${index}`) || 'null');
      if (saved) {
        levelRecords[index] = normalizeLevelRecord(index, saved);
        return levelRecords[index];
      }
    } catch (_) {}
    return null;
  }

  function getOverallScorecard() {
    const records = levels.map((_, index) => getLevelBest(index));
    const completed = records.filter(Boolean).length;
    const score = records.reduce((sum, record) => sum + (record?.score || 0), 0);
    const stars = records.reduce((sum, record) => sum + (record?.stars || 0), 0);
    return { records, completed, score, stars, rank: overallRank(score, completed) };
  }

  function completeLevel() {
    if (mode !== 'playing') return;
    const found = world.shards.filter(s => s.collected).length;
    const result = { time: elapsed, shards: found, total: world.shards.length, attempts };
    stats[levelIndex] = saveLevelBest(levelIndex, result);
    if (levelIndex === levels.length - 1) saveBestRun();
    mode = 'complete';
    burst(world.goal.x + world.goal.w / 2, world.goal.y + 18, phaseColor(), 26, 220);
    chord();
    setStatus(`Level complete. Score ${stats[levelIndex].score}. ${stats[levelIndex].stars} stars.`);

  function die() {

  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function activePlatforms() {
    return world.platforms.filter(p => p.phase === undefined || p.phase === phase);
  }

  function approach(value, target, amount) {
    return value < target ? Math.min(value + amount, target) : Math.max(value - amount, target);
  }

  function updateGame(dt) {
    phasePulse = Math.max(0, phasePulse - dt * 2.8);

    if (mode === 'dead') {
      deathTimer -= dt;
      if (deathTimer <= 0) {
        attempts += 1;
        loadLevel();
      }
      return;
    }
    if (mode !== 'playing') return;

    if (introTimer > 0) {
      introTimer = Math.max(0, introTimer - dt);
      input.jumpPressed = false;
      input.phasePressed = false;
      return;
    }

    elapsed += dt;
    runElapsed += dt;

    if (input.phasePressed) {
      phase = 1 - phase;
      phasePulse = 1;
      input.phasePressed = false;
      burst(player.x + player.w / 2, player.y + player.h / 2, phaseColor(), 10, 110);
      beep(phase === 0 ? 360 : 520, .055, 'sine', .025);
    }

    if (input.jumpPressed) player.jumpBuffer = .12;
    input.jumpPressed = false;

    player.jumpBuffer = Math.max(0, player.jumpBuffer - dt);
    player.coyote = player.grounded ? .09 : Math.max(0, player.coyote - dt);

    const direction = (input.right ? 1 : 0) - (input.left ? 1 : 0);
    const accel = player.grounded ? 1850 : 1120;
    const drag = player.grounded ? 2100 : 360;
    if (direction) {
      player.vx = approach(player.vx, direction * 275, accel * dt);
      player.facing = direction;
    } else {
      player.vx = approach(player.vx, 0, drag * dt);
    }

    if (player.jumpBuffer > 0 && player.coyote > 0) {
      player.vy = -548;
      player.grounded = false;
      player.coyote = 0;
      player.jumpBuffer = 0;
      burst(player.x + player.w / 2, player.y + player.h, COLORS.ink, 7, 80);
      beep(210, .05, 'square', .02);
    }

    player.vy = Math.min(player.vy + 1450 * dt, 720);

    // Horizontal movement and collision.
    player.x += player.vx * dt;
    for (const p of activePlatforms()) {
      if (!rectsOverlap(player, p)) continue;
      if (player.vx > 0) player.x = p.x - player.w;
      else if (player.vx < 0) player.x = p.x + p.w;
      player.vx = 0;
    }
    if (player.x < 0) { player.x = 0; player.vx = 0; }
    if (player.x + player.w > W) { player.x = W - player.w; player.vx = 0; }

    // Vertical movement and collision.
    player.y += player.vy * dt;
    player.grounded = false;
    for (const p of activePlatforms()) {
      if (!rectsOverlap(player, p)) continue;
      if (player.vy > 0) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.grounded = true;
      } else if (player.vy < 0) {
        player.y = p.y + p.h;
        player.vy = 0;
      }
    }

    for (const hazard of world.hazards) {
      const hitbox = { x: hazard.x + 5, y: hazard.y + 3, w: hazard.w - 10, h: hazard.h };
      if (rectsOverlap(player, hitbox)) {
        die();
        return;
      }
    }
    if (player.y > H + 80) {
      die();
      return;
    }

    for (const shard of world.shards) {
      if (shard.collected) continue;
      const dx = player.x + player.w / 2 - shard.x;
      const dy = player.y + player.h / 2 - shard.y;
      if (dx * dx + dy * dy < 28 * 28) {
        shard.collected = true;
        burst(shard.x, shard.y, phaseColor(), 14, 150);
        beep(640, .07, 'sine', .025);
        setStatus('Signal collected');
      }
    }

    const goalActive = world.goal.phase === undefined || world.goal.phase === phase;
    if (goalActive && rectsOverlap(player, world.goal)) completeLevel();
  }

  function burst(x, y, color, count = 12, speed = 120) {
    if (reducedMotion) count = Math.min(count, 4);
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const power = speed * (.35 + Math.random() * .65);
      particles.push({
        x, y,
        vx: Math.cos(angle) * power,
        vy: Math.sin(angle) * power,
        life: .35 + Math.random() * .45,
        maxLife: .8,
        size: 2 + Math.random() * 4,
        color
      });
    }
  }

  function updateParticles(dt) {
    particles = particles.filter(p => {
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 260 * dt;
      p.vx *= Math.pow(.25, dt);
      return p.life > 0;
    });
  }

  let audioCtx = null;
  function beep(frequency, duration, type = 'sine', volume = .02) {
    try {
      audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(frequency, now);
      gain.gain.setValueAtTime(volume, now);
      gain.gain.exponentialRampToValueAtTime(.0001, now + duration);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + duration);
    } catch (_) {}
  }

  function chord() {
    beep(392, .24, 'sine', .018);
    setTimeout(() => beep(523, .22, 'sine', .016), 70);
    setTimeout(() => beep(659, .28, 'sine', .014), 140);
  }

  function phaseColor(which = phase) {
    return which === 0 ? COLORS.coral : COLORS.cyan;
  }

  function roundedRect(x, y, w, h, r) {
    const radius = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.arcTo(x + w, y, x + w, y + h, radius);
    ctx.arcTo(x + w, y + h, x, y + h, radius);
    ctx.arcTo(x, y + h, x, y, radius);
    ctx.arcTo(x, y, x + w, y, radius);
    ctx.closePath();
  }

  function fillRound(x, y, w, h, r, color) {
    roundedRect(x, y, w, h, r);
    ctx.fillStyle = color;
    ctx.fill();
  }

  function drawBackground() {
    ctx.fillStyle = COLORS.paper;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.fillStyle = 'rgba(29,35,43,.055)';
    for (let x = 26; x < W; x += 42) {
      for (let y = 26; y < H; y += 42) {
        ctx.beginPath();
        ctx.arc(x, y, 1.15, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();

    if (mode !== 'menu') {
      const color = phaseColor();
      const gradient = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 480);
      gradient.addColorStop(0, color + '09');
      gradient.addColorStop(1, color + '00');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function drawPlatform(p) {
    const isPhased = p.phase !== undefined;
    const active = !isPhased || p.phase === phase;
    const color = isPhased ? phaseColor(p.phase) : COLORS.ink;

    ctx.save();
    if (active) {
      ctx.shadowColor = isPhased ? color + '32' : 'rgba(29,35,43,.13)';
      ctx.shadowBlur = 12;
      ctx.shadowOffsetY = 5;
      fillRound(p.x, p.y, p.w, p.h, Math.min(7, p.h / 2), color);
      ctx.shadowColor = 'transparent';
      ctx.fillStyle = 'rgba(255,255,255,.26)';
      ctx.fillRect(p.x + 8, p.y + 4, Math.max(0, p.w - 16), 2);
    } else {
      ctx.globalAlpha = .32;
      ctx.setLineDash([7, 7]);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      roundedRect(p.x, p.y, p.w, p.h, Math.min(7, p.h / 2));
      ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();
  }

  function drawHazard(h) {
    const spike = 18;
    ctx.save();
    ctx.fillStyle = COLORS.ink;
    ctx.globalAlpha = .82;
    ctx.beginPath();
    ctx.moveTo(h.x, h.y + h.h);
    for (let x = h.x; x < h.x + h.w; x += spike) {
      ctx.lineTo(Math.min(x + spike / 2, h.x + h.w), h.y);
      ctx.lineTo(Math.min(x + spike, h.x + h.w), h.y + h.h);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawShard(s, index) {
    if (s.collected) return;
    const bob = reducedMotion ? 0 : Math.sin(performance.now() / 360 + index * 1.7) * 4;
    ctx.save();
    ctx.translate(s.x, s.y + bob);

  function drawGoal(goal) {
    ctx.save();
    const near = Math.abs((player.x + player.w / 2) - (goal.x + goal.w / 2)) < 115;
    const goalPhase = goal.phase === undefined ? phase : goal.phase;
    const unlocked = goal.phase === undefined || goal.phase === phase;
    const goalColor = phaseColor(goalPhase);
    ctx.globalAlpha = unlocked ? (near ? 1 : .78) : .48;
    ctx.lineWidth = 5;
    ctx.strokeStyle = COLORS.ink;
    if (!unlocked) ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(goal.x, goal.y + goal.h);
    ctx.lineTo(goal.x, goal.y + 22);
    ctx.arc(goal.x + goal.w / 2, goal.y + 22, goal.w / 2, Math.PI, 0);
    ctx.lineTo(goal.x + goal.w, goal.y + goal.h);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = goalColor + (unlocked && near ? '28' : '12');
    ctx.fillRect(goal.x + 6, goal.y + 24, goal.w - 12, goal.h - 24);
    ctx.fillStyle = goalColor;
    ctx.beginPath();
    ctx.arc(goal.x + goal.w - 11, goal.y + goal.h / 2 + 8, 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawPlayer() {
    if (mode === 'dead' && deathTimer < .55) return;
    const speedLean = Math.max(-.09, Math.min(.09, player.vx / 2400));
    const bounce = player.grounded ? 0 : Math.min(2, Math.abs(player.vy) / 320);
    ctx.save();
    ctx.translate(player.x + player.w / 2, player.y + player.h / 2);
    ctx.rotate(speedLean);
    ctx.shadowColor = 'rgba(29,35,43,.18)';
    ctx.shadowBlur = 10;
    ctx.shadowOffsetY = 6;
    fillRound(-player.w / 2, -player.h / 2 + bounce, player.w, player.h - bounce, 8, COLORS.ink);
    ctx.shadowColor = 'transparent';
    ctx.fillStyle = phaseColor();
    ctx.fillRect(-player.w / 2 + 5, player.h / 2 - 8, player.w - 10, 3);
    ctx.fillStyle = COLORS.white;
    const eyeX = player.facing > 0 ? 5 : -9;
    fillRound(eyeX, -7, 4, 6, 2, COLORS.white);
    ctx.restore();
  }

  function drawParticles() {
    ctx.save();

    const t = reducedMotion ? 0 : performance.now() / 1000;
    ctx.save();
    const leftX = 95 + Math.sin(t * .35) * 24;
    const rightX = W - 95 + Math.cos(t * .31) * 24;
    const glowA = ctx.createRadialGradient(leftX, 210, 0, leftX, 210, 230);

    ctx.fillStyle = glowB;
    ctx.fillRect(0, 0, W, H);

    for (let i = 0; i < 9; i++) {
      const x = 44 + i * 112 + Math.sin(t * .5 + i) * 8;
      const y = 116 + (i % 3) * 102 + Math.cos(t * .6 + i * .8) * 9;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(Math.PI / 4 + t * .08 * (i % 2 ? 1 : -1));
      ctx.globalAlpha = .08 + (i % 3) * .025;

  function drawMenuRunner() {
    const seconds = performance.now() / 1000;
    const progress = reducedMotion ? .12 : (seconds % 7.5) / 7.5;
    const x = 75 + progress * 790;
    const platforms = [
      { x: 62, w: 174, phase: 0 },
      { x: 258, w: 175, phase: 1 },
      { x: 455, w: 175, phase: 0 },
      { x: 652, w: 244, phase: 1 }
    ];
    const section = x < 247 ? 0 : x < 444 ? 1 : x < 641 ? 2 : 3;
    const demoPhase = platforms[section].phase;
    const platformY = 370;

    // Jumps are centered only over the three platform gaps, so the character
    // always takes off from and lands on the visible blocks.
    const gapCenters = [247, 444, 641];
    let jumpHeight = 0;
    gapCenters.forEach(center => {
      const distance = Math.abs(x - center);
      if (distance < 42) jumpHeight = Math.max(jumpHeight, (1 - Math.pow(distance / 42, 2)) * 28);
    });
    const characterBottom = platformY - 1 - jumpHeight;
    const run = seconds * 10;

    ctx.save();
    platforms.forEach(platform => {
      const active = platform.phase === demoPhase;
      const color = phaseColor(platform.phase);
      if (active) {
        ctx.shadowColor = color + '35';
        ctx.shadowBlur = 10;
        fillRound(platform.x, platformY, platform.w, 8, 4, color);
        ctx.shadowColor = 'transparent';
      } else {
        ctx.globalAlpha = .33;
        ctx.setLineDash([6, 6]);
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        roundedRect(platform.x, platformY, platform.w, 8, 4);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha = 1;
      }
    });

    const doorColor = phaseColor(demoPhase);
    ctx.lineWidth = 4;
    ctx.strokeStyle = COLORS.ink;
    ctx.beginPath();
    ctx.moveTo(858, platformY);
    ctx.lineTo(858, platformY - 28);
    ctx.arc(875, platformY - 28, 17, Math.PI, 0);
    ctx.lineTo(892, platformY);
    ctx.stroke();
    ctx.fillStyle = doorColor + '25';
    ctx.fillRect(863, platformY - 27, 24, 27);
    ctx.fillStyle = doorColor;
    ctx.beginPath();
    ctx.arc(885, platformY - 12, 2.5, 0, Math.PI * 2);
    ctx.fill();

    const fade = Math.min(1, progress * 10, (1 - progress) * 12);
    const groundedAmount = 1 - Math.min(1, jumpHeight / 28);
    ctx.globalAlpha = fade;
    ctx.fillStyle = 'rgba(29,35,43,.16)';
    ctx.beginPath();
    ctx.ellipse(x, platformY + 3, 11 * (.65 + groundedAmount * .35), 3, 0, 0, Math.PI * 2);
    ctx.fill();

    // Legless animated character: motion comes from lean, squash, bounce,
    // blinking, and the phase stripe rather than added limbs.
    ctx.save();
    ctx.translate(x, characterBottom);
    const lean = jumpHeight > 0 ? -.05 : Math.sin(run) * .035;
    const bob = jumpHeight > 0 ? 0 : Math.sin(run * 2) * .8;
    const squash = jumpHeight > 0 ? 1.04 : 1 + Math.sin(run * 2) * .018;
    ctx.rotate(lean);
    ctx.scale(1 / squash, squash);
    ctx.shadowColor = 'rgba(29,35,43,.2)';
    ctx.shadowBlur = 10;
    ctx.shadowOffsetY = 5;
    fillRound(-11, -30 + bob, 22, 29, 7, COLORS.ink);
    ctx.shadowColor = 'transparent';
    ctx.fillStyle = doorColor;
    ctx.fillRect(-6, -8 + bob, 12, 3);
    const blink = !reducedMotion && Math.floor(seconds * 2.2) % 13 === 0;
    fillRound(4, -22 + bob, 3, blink ? 2 : 5, 2, COLORS.white);
    ctx.restore();
    ctx.restore();
  }

  function drawStat(x, y, value, label) {
    ctx.save();
    ctx.textAlign = 'center';

    roundedRect(x - 74, y, 148, 90, 17);

  function drawDeathFade() {
    if (mode !== 'dead') return;
    const alpha = Math.max(0, Math.min(.28, (.68 - deathTimer) * .8));
    ctx.save();
    ctx.fillStyle = `rgba(29,35,43,${alpha})`;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  function formatTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    const tenths = Math.floor((seconds % 1) * 10);
    return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}.${tenths}`;
  }

  function render() {
    mobileControls.classList.toggle('hidden', mode !== 'playing' && mode !== 'dead');
    const onGameMenu = mode === 'menu';
    gameHome.setAttribute('href', onGameMenu ? 'index.html' : 'game.html');
    gameHome.setAttribute('aria-label', onGameMenu ? 'Return to project home page' : 'Return to game main menu');
    gameHomeLong.textContent = onGameMenu ? 'PROJECT HOME' : 'MAIN MENU';
    gameHomeShort.textContent = onGameMenu ? 'HOME' : 'MENU';
    fullscreenControl.classList.toggle('menu-position', onGameMenu);
    musicPanel.classList.toggle('menu-position', onGameMenu);
    phaseButton.style.background = phaseColor();
    phaseButton.setAttribute('aria-label', `Change to ${phase === 0 ? 'cyan' : 'coral'} phase`);
    const scaleX = canvas.width / W;
    const scaleY = canvas.height / H;
    ctx.setTransform(scaleX, 0, 0, scaleY, 0, 0);
    ctx.clearRect(0, 0, W, H);

    if (mode === 'menu') {
      drawMenu();
      return;
    }
    if (mode === 'levelSelect') {
      drawLevelSelect();
      return;
    }
    if (mode === 'scorecard') {
      drawScorecard();
      return;
    }

    drawBackground();
    for (const p of world.platforms) drawPlatform(p);
    for (const h of world.hazards) drawHazard(h);
    world.shards.forEach(drawShard);
    drawGoal(world.goal);
    drawPlayer();
    drawParticles();
    drawHUD();
    drawLevelIntro();
    drawDeathFade();
    drawOverlay();
  }

  function frame(now) {
    const frameDelta = Math.min(MAX_FRAME_DELTA, Math.max(0, (now - lastTime) / 1000));
    lastTime = now;
    accumulator = Math.min(MAX_FRAME_DELTA, accumulator + frameDelta);

    while (accumulator >= FIXED_STEP) {
      accumulator -= FIXED_STEP;
      updateGame(FIXED_STEP);
      updateParticles(FIXED_STEP);
    }

    render();
    requestAnimationFrame(frame);
  }

  function resize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.round(rect.width * dpr));
    canvas.height = Math.max(1, Math.round(rect.height * dpr));
  }

  function onKeyDown(event) {
    const target = event.target;
    if (target instanceof HTMLInputElement || target instanceof HTMLButtonElement || target instanceof HTMLAnchorElement || target instanceof HTMLSelectElement || target instanceof HTMLTextAreaElement) return;

    const key = event.key.toLowerCase();
    const handled = ['arrowleft','arrowright','arrowup','arrowdown','a','c','d','f','w','s','e','shift',' ','enter','escape','r','l'].includes(key);
    if (handled) event.preventDefault();

    if ((key === 'f' || (key === 'escape' && gameFrame.classList.contains('pseudo-fullscreen'))) && !event.repeat) {
      toggleFullscreen();
      return;
    }

    if (mode === 'levelSelect') {
      if ((key === 'arrowleft' || key === 'a') && !event.repeat) {
        selectedLevel = (selectedLevel + levels.length - 1) % levels.length;
        beep(280, .035, 'sine', .012);
      }
      if ((key === 'arrowright' || key === 'd') && !event.repeat) {
        selectedLevel = (selectedLevel + 1) % levels.length;
        beep(330, .035, 'sine', .012);
      }
      if ((key === 'arrowup' || key === 'w' || key === 'arrowdown' || key === 's') && !event.repeat) {
        selectedLevel = (selectedLevel + 5) % levels.length;
        beep(305, .035, 'sine', .012);
      }
      if ((key === 'enter' || key === ' ') && !event.repeat) startSelectedLevel();
      if (key === 'escape' && !event.repeat) {
        mode = 'menu';
        setStatus('Title screen');
      }
      return;
    }

    if (mode === 'scorecard') {
      if (resetConfirmation) {
        if (key === 'escape' && !event.repeat) cancelProgressReset();
        if (key === 'enter' && !event.repeat) resetAllProgress();
        return;
      }
      if (key === 'r' && !event.repeat) requestProgressReset();
      else if ((key === 'escape' || key === 'enter' || key === ' ') && !event.repeat) returnToMainMenu();
      return;
    }

    if (mode === 'menu' && (key === 'c' || key === 's') && !event.repeat) {
      openScorecard();
      return;
    }

    if ((key === 'l' || key === 'escape') && !event.repeat) {
      openLevelSelect();
      return;
    }

    if (mode === 'playing' && (key === 'arrowleft' || key === 'a')) input.left = true;
    if (mode === 'playing' && (key === 'arrowright' || key === 'd')) input.right = true;
    if ((key === 'arrowup' || key === 'w' || key === ' ') && !event.repeat) {
      if (mode === 'playing') input.jumpPressed = true;
      else primaryAction();
    }
    if ((key === 'shift' || key === 'e') && !event.repeat && mode === 'playing') input.phasePressed = true;
    if (key === 'enter' && !event.repeat) primaryAction();
    if (key === 'r' && !event.repeat) restartLevel();
  }

  function onKeyUp(event) {
    const key = event.key.toLowerCase();
    if (key === 'arrowleft' || key === 'a') input.left = false;
    if (key === 'arrowright' || key === 'd') input.right = false;
  }

  function mobileInteractionFeedback(button, event, sound = true) {
    clearBrowserSelection();
    button.classList.add('pressed');
    button.setAttribute('aria-pressed', 'true');
    if (event.pointerType === 'touch' && navigator.vibrate) navigator.vibrate(14);
    if (sound) beep(340, .025, 'square', .006);
  }

  function clearMobileButton(button) {
    button.classList.remove('pressed');
    button.setAttribute('aria-pressed', 'false');
  }

  function bindHold(id, property) {
    const button = document.getElementById(id);
    const down = event => {
      event.preventDefault();
      input[property] = true;
      mobileInteractionFeedback(button, event, true);
      button.setPointerCapture?.(event.pointerId);
      canvas.focus();
    };
    const up = event => {
      event.preventDefault();
      input[property] = false;
      clearMobileButton(button);
    };
    button.addEventListener('pointerdown', down, { passive: false });
    button.addEventListener('pointerup', up, { passive: false });
    button.addEventListener('pointercancel', up, { passive: false });
    button.addEventListener('lostpointercapture', up, { passive: false });
  }

  function bindPress(id, property) {
    const button = document.getElementById(id);
    const release = event => {
      if (event) event.preventDefault();
      clearMobileButton(button);
    };
    button.addEventListener('pointerdown', event => {
      event.preventDefault();
      mobileInteractionFeedback(button, event, false);
      button.setPointerCapture?.(event.pointerId);
      if (mode === 'playing') input[property] = true;
      else primaryAction();
      canvas.focus();
      setTimeout(() => clearMobileButton(button), 110);
    }, { passive: false });
    button.addEventListener('pointerup', release, { passive: false });
    button.addEventListener('pointercancel', release, { passive: false });
    button.addEventListener('lostpointercapture', release, { passive: false });
  }

  bindHold('left', 'left');
  bindHold('right', 'right');
  bindPress('jump', 'jumpPressed');
  bindPress('phase', 'phasePressed');

  [gameFrame, canvas, mobileControls].forEach(surface => {
    surface.addEventListener('contextmenu', event => event.preventDefault());
    surface.addEventListener('selectstart', event => event.preventDefault());
    surface.addEventListener('dragstart', event => event.preventDefault());
  });
  const preventTouchSelection = event => {
    clearBrowserSelection();
    if (event.cancelable) event.preventDefault();
  };
  [canvas, mobileControls].forEach(surface => {
    surface.addEventListener('touchstart', preventTouchSelection, { passive: false });
    surface.addEventListener('touchmove', preventTouchSelection, { passive: false });
    surface.addEventListener('touchend', clearBrowserSelection, { passive: true });
    surface.addEventListener('touchcancel', clearBrowserSelection, { passive: true });
  });
  gameFrame.addEventListener('pointerdown', clearBrowserSelection, { capture: true });
  document.addEventListener('selectionchange', clearBrowserSelection);
  document.addEventListener('gesturestart', event => event.preventDefault(), { passive: false });

  function canvasPoint(event) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (event.clientX - rect.left) * W / rect.width,
      y: (event.clientY - rect.top) * H / rect.height
    };
  }

  function pointInRect(point, rect) {
    return point.x >= rect.x && point.x <= rect.x + rect.w && point.y >= rect.y && point.y <= rect.y + rect.h;
  }

  function levelAtPoint(point) {
    for (let i = 0; i < levels.length; i++) {
      if (pointInRect(point, getLevelCardRect(i))) return i;
    }
    return -1;
  }

  window.addEventListener('message', event => {
    if (!isTrustedParentMessage(event)) return;
    const data = event.data && typeof event.data === 'object' ? event.data : {};
    if (data.type !== 'monoshift-parent-music-state') return;
    musicEnabled = Boolean(data.enabled);
    const parentLevel = Number(data.level);
    if (Number.isFinite(parentLevel)) musicLevel = Math.max(0, Math.min(100, parentLevel));
    applyMusicSettings(false);
    saveMusicSettings();
  });

  gameHome.addEventListener('click', event => {
    if (mode === 'menu') {
      if (embeddedShell) {
        event.preventDefault();
        window.parent.postMessage({ type: 'monoshift-show-home' }, parentTargetOrigin);
      }
      return;
    }
    event.preventDefault();
    returnToMainMenu();
  });

  fullscreenControl.addEventListener('click', event => {
    event.preventDefault();
    toggleFullscreen();
  });
  document.addEventListener('fullscreenchange', updateFullscreenUI);
  document.addEventListener('webkitfullscreenchange', updateFullscreenUI);

  musicToggle.addEventListener('click', event => {
    event.preventDefault();
    toggleBackgroundMusic();
  });

  musicVolume.addEventListener('input', () => {
    musicLevel = Number(musicVolume.value);
    musicUnlocked = true;
    applyMusicSettings(true);
    if (musicEnabled && musicLevel > 0) startBackgroundMusic();
  });
  musicVolume.addEventListener('change', saveMusicSettings);

  window.addEventListener('pointerdown', startBackgroundMusic, { once: true, passive: true });
  window.addEventListener('keydown', startBackgroundMusic, { once: true, passive: true });

  canvas.addEventListener('pointermove', event => {
    canvasPointer = canvasPoint(event);
    if (mode !== 'levelSelect') return;
    const hovered = levelAtPoint(canvasPointer);
    if (hovered >= 0) selectedLevel = hovered;
  });
  canvas.addEventListener('pointerleave', () => { canvasPointer = { x: -999, y: -999 }; });

  canvas.addEventListener('pointerdown', event => {
    const point = canvasPoint(event);
    if (mode === 'menu') {
      if (pointInRect(point, MENU_SELECT)) openLevelSelect();
      else if (pointInRect(point, MENU_SCORES)) openScorecard();
      else if (pointInRect(point, MENU_PLAY)) startGame(0);
    } else if (mode === 'levelSelect') {
      const chosen = levelAtPoint(point);
      if (chosen >= 0) {
        selectedLevel = chosen;
        startSelectedLevel();
      } else if (pointInRect(point, LEVEL_BACK)) {
        mode = 'menu';
        setStatus('Title screen');
      }
    } else if (mode === 'scorecard') {
      if (resetConfirmation) {
        if (pointInRect(point, RESET_CANCEL)) cancelProgressReset();
        else if (pointInRect(point, RESET_CONFIRM)) resetAllProgress();
      } else if (pointInRect(point, SCORE_BACK)) {
        returnToMainMenu();
      } else if (pointInRect(point, SCORE_RESET)) {
        requestProgressReset();
      }
    } else if (mode === 'playing') {
      if (pointInRect(point, HUD_LEVELS)) openLevelSelect();
    } else if (mode === 'finished' && pointInRect(point, FINISH_SELECT)) {
      openLevelSelect();
    } else {
      primaryAction();
    }
    canvas.focus();
  });
  window.addEventListener('keydown', onKeyDown, { passive: false });
  window.addEventListener('keyup', onKeyUp);
  window.addEventListener('blur', clearInput);
  document.addEventListener('visibilitychange', () => {
    clearInput();
    accumulator = 0;
    lastTime = performance.now();
  });
  window.addEventListener('resize', resize);
  new ResizeObserver(resize).observe(canvas);

  loadMusicSettings();
  updateFullscreenUI();
  if (embeddedShell) window.parent.postMessage({ type: 'monoshift-request-music-state' }, parentTargetOrigin);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
